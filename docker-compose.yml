services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_PORT:-9000}:9000"
    volumes:
      - ./volume:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-energosbyt}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-energosbyt}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT:-1}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"${CLICKHOUSE_USER:-default}\" --password \"${CLICKHOUSE_PASSWORD:-}\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  app:
    build:
      context: .
    environment:
      APP_PORT: ${APP_PORT:-8080}
      APP_CLICKHOUSE_RETRIES: ${APP_CLICKHOUSE_RETRIES:-30}
      APP_CLICKHOUSE_RETRY_DELAY_SEC: ${APP_CLICKHOUSE_RETRY_DELAY_SEC:-2}
      APP_CLICKHOUSE_PING_TIMEOUT_SEC: ${APP_CLICKHOUSE_PING_TIMEOUT_SEC:-5}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-9000}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-energosbyt}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      clickhouse:
        condition: service_healthy
