services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_PORT}:9000"
    volumes:
      - ./volume:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$CLICKHOUSE_USER\" --password \"$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  app:
    build:
      context: .
    environment:
      APP_PORT: ${APP_PORT}
      APP_CLICKHOUSE_RETRIES: ${APP_CLICKHOUSE_RETRIES}
      APP_CLICKHOUSE_RETRY_DELAY_SEC: ${APP_CLICKHOUSE_RETRY_DELAY_SEC}
      APP_CLICKHOUSE_PING_TIMEOUT_SEC: ${APP_CLICKHOUSE_PING_TIMEOUT_SEC}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      clickhouse:
        condition: service_healthy
